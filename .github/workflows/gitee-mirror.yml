name: Gitee Mirror Fallback

# 手动兜底：日常镜像同步由 Gitee 侧流水线执行
# （.workflow/gitee-mirror.yml，定时从 GitHub 拉取），
# 本工作流仅在需要时手动触发，运行同一份 .workflow/mirror_sync.sh。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Run mirror sync
        env:
          SYNC_GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: bash .workflow/mirror_sync.sh
