name: Quality checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake clang pkg-config libssl-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.93.1'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Fetch official JavaScript plugin test sources
        shell: bash
        run: |
          set -euo pipefail
          for plugin in ai-scraper-js ai-cover-generator ai-booklist-assistant rss-feed ting-reader-plugin-store; do
            git clone --depth 1 --branch v2.0.4 \
              "https://github.com/dqsq2e2/${plugin}.git" \
              "$RUNNER_TEMP/ting-reader-js-plugins/${plugin}"
          done
      - name: Check formatting
        working-directory: backend
        run: cargo fmt --all -- --check
      - name: Check all targets
        working-directory: backend
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run tests
        working-directory: backend
        env:
          TING_TEST_JS_PLUGIN_DIR: ${{ runner.temp }}/ting-reader-js-plugins
        run: cargo test --locked
      - name: Report tests requiring external artifacts
        working-directory: backend
        run: |
          cargo test --locked --lib -- --list --ignored >> "$GITHUB_STEP_SUMMARY"
          echo "External artifact tests are listed above; they are not included in the passing test count." >> "$GITHUB_STEP_SUMMARY"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
