name: Native FPK Build and Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to rebuild from the selected source ref, e.g. v2.0.7'
        type: string
        default: ''
  push:
    tags:
      - 'v*'

env:
  FNPACK_VERSION: "1.2.3"
  FYGOPACK_VERSION: "1.2.3"
  FFMPEG_BUILD_VERSION: "8.1.2-2"
  TING_PLUGIN_STORE_VERSION: "2.0.4"

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    permissions:
      contents: read

  native:
    needs: quality
    runs-on: ${{ matrix.runner }}
    container: rust:bookworm
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: x86
            fpk_suffix: x86_64
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            arch: arm
            fpk_suffix: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Configure Git workspace for container steps
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" rev-parse --show-toplevel

      - name: Resolve release context
        id: release_context
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$REQUESTED_TAG" ]; then
            [[ "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            git ls-remote --exit-code origin "refs/tags/$REQUESTED_TAG" >/dev/null
            TARGET="formal"
            VERSION="${REQUESTED_TAG#v}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="beta"
            VERSION="beta"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TARGET="formal"
            VERSION="${GITHUB_REF_NAME#v}"
          else
            echo "Unsupported release trigger: ${{ github.event_name }} / ${{ github.ref_type }}"
            exit 1
          fi

          if [ "$TARGET" = formal ]; then
            SOURCE_VERSION="$(awk -F'"' '/^version[[:space:]]*=/{print $2; exit}' backend/Cargo.toml)"
            if [ "$SOURCE_VERSION" != "$VERSION" ]; then
              echo "::error::Source version $SOURCE_VERSION does not match release version $VERSION"
              exit 1
            fi
          fi

          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "target=$TARGET" >> $GITHUB_OUTPUT
          echo "Resolved $TARGET build for version $VERSION"
          echo "Source commit: $(git rev-parse HEAD)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake clang binutils
          rustup target add ${{ matrix.target }}
          getconf GNU_LIBC_VERSION

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend
        run: |
          cd frontend
          VITE_APP_BASE_URL=/app/ting-reader/ npm run build

      - name: Inject OpenSSL Vendored Dependency
        run: |
          cd backend
          # Inject openssl vendored dependency for static linking to avoid shared library issues
          if ! grep -q "^openssl" Cargo.toml; then
            sed -i '/^\[dependencies\]/a openssl = { version = "0.10", features = ["vendored"] }' Cargo.toml
            echo "Injected OpenSSL vendored dependency."
          else
            echo "OpenSSL dependency found, assuming it's correct."
          fi
          # Print first 20 lines to verify
          head -n 20 Cargo.toml

      - name: Build Backend
        run: |
          cd backend
          cargo build --release --target ${{ matrix.target }}

      - name: Download pinned FFmpeg and FFprobe for server package
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-gnu)
              FFMPEG_ARCH="x86_64"
              FFMPEG_SHA256="58246304b840d40f600e7a03673695061d51ee864b11b35dbaa0983aa6506bc6"
              ;;
            aarch64-unknown-linux-gnu)
              FFMPEG_ARCH="arm64"
              FFMPEG_SHA256="c12dca8818065a1ad04023eecec3d2d44542b9c1095f13eb9b028fd224ac3d28"
              ;;
            *)
              echo "Unsupported FFmpeg target: ${{ matrix.target }}" >&2
              exit 1
              ;;
          esac
          FFMPEG_ASSET="ffmpeg-8.1.2-audio-encode-${FFMPEG_ARCH}-linux-gnu.tar.gz"
          FFMPEG_ROOT="ffmpeg-8.1.2-audio-encode-${FFMPEG_ARCH}-linux-gnu"
          mkdir -p "$RUNNER_TEMP/ting-media/bin"
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/ffmpeg.tar.gz" \
            "https://github.com/dqsq2e2/ffmpeg-build/releases/download/v${FFMPEG_BUILD_VERSION}/${FFMPEG_ASSET}"
          echo "${FFMPEG_SHA256}  $RUNNER_TEMP/ffmpeg.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/ffmpeg.tar.gz" --strip-components=2 \
            -C "$RUNNER_TEMP/ting-media/bin" \
            "$FFMPEG_ROOT/bin/ffmpeg" "$FFMPEG_ROOT/bin/ffprobe"
          readelf -h "$RUNNER_TEMP/ting-media/bin/ffmpeg" | grep 'Machine:'

      - name: Prepare App Directory
        run: |
          mkdir -p .github/ting-reader-fpk-native/app/server
          mkdir -p .github/ting-reader-fpk-native/app/server/preinstalled-plugins
          echo "Listing target directory:"
          find backend/target -type f | grep "ting_reader" || true
          find backend/target -type f | grep "ting-reader" || true

          # Try to find binary with underscore (default for cargo) or hyphen
          BINARY_PATH=$(find backend/target -type f \( -name "ting_reader" -o -name "ting-reader" \) | grep "${{ matrix.target }}/release/ting[-_]reader$" | head -n 1)

          if [ -z "$BINARY_PATH" ]; then
            echo "Error: ting-reader binary not found in target directory!"
            exit 1
          fi

          echo "Found binary at: $BINARY_PATH"
          # Always copy as ting-reader (hyphen) to match scripts
          cp "$BINARY_PATH" .github/ting-reader-fpk-native/app/server/ting-reader
          mkdir -p .github/ting-reader-fpk-native/app/server/bin
          install -m 755 "$RUNNER_TEMP/ting-media/bin/"{ffmpeg,ffprobe} \
            .github/ting-reader-fpk-native/app/server/bin/
          .github/ting-reader-fpk-native/app/server/bin/ffmpeg -hide_banner -encoders \
            | grep 'libmp3lame'
          .github/ting-reader-fpk-native/app/server/bin/ffprobe -version

          cp backend/config.toml .github/ting-reader-fpk-native/app/server/
          cp -r frontend/dist .github/ting-reader-fpk-native/app/server/static
          curl --fail --location --retry 3 \
            "https://github.com/dqsq2e2/ting-reader-plugin-store/releases/download/v${TING_PLUGIN_STORE_VERSION}/ting-reader-plugin-store-${TING_PLUGIN_STORE_VERSION}.tr" \
            --output .github/ting-reader-fpk-native/app/server/preinstalled-plugins/ting-reader-plugin-store.tr
          chmod +x .github/ting-reader-fpk-native/app/server/ting-reader
          chmod +x .github/ting-reader-fpk-native/cmd/*

      - name: Verify packaged server on Debian 12
        run: |
          set -euo pipefail
          SERVER_DIR=".github/ting-reader-fpk-native/app/server"
          for binary in "$SERVER_DIR/ting-reader" "$SERVER_DIR/bin/ffmpeg" "$SERVER_DIR/bin/ffprobe"; do
            required_glibc=$(readelf --version-info "$binary" \
              | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -Vu | tail -n 1)
            echo "$binary requires $required_glibc"
            if [ "$(printf '%s\n' "$required_glibc" GLIBC_2.36 | sort -V | tail -n 1)" != "GLIBC_2.36" ]; then
              echo "::error::$binary requires a newer glibc than the fnOS Debian 12 baseline."
              exit 1
            fi
          done
          "$SERVER_DIR/ting-reader" --help
          "$SERVER_DIR/bin/ffmpeg" -hide_banner -version
          "$SERVER_DIR/bin/ffprobe" -hide_banner -version

      - name: Setup fnpack
        uses: ./.github/actions/setup-fnpack
        with:
          version: ${{ env.FNPACK_VERSION }}

      - name: Setup fygopack
        uses: ./.github/actions/setup-fygopack
        with:
          version: ${{ env.FYGOPACK_VERSION }}

      - name: Build FPK
        run: |
          VERSION="${{ env.VERSION }}"
          TARGET="${{ steps.release_context.outputs.target }}"

          if [ "$TARGET" = "beta" ]; then
            echo "Building for Beta release..."
            VERSION="beta"
            FN_OUTPUT="ting-reader-native-${{ matrix.fpk_suffix }}-beta.fpk"
            FYGO_OUTPUT="ting-reader-native-fygo-${{ matrix.fpk_suffix }}-beta.fpk"
          else
            echo "Building for Formal release v$VERSION..."
            FN_OUTPUT="ting-reader-native-${{ matrix.fpk_suffix }}-${VERSION}.fpk"
            FYGO_OUTPUT="ting-reader-native-fygo-${{ matrix.fpk_suffix }}-${VERSION}.fpk"
          fi

          # Update manifest with version
          sed -i "s/^version[[:space:]]*=.*/version = $VERSION/" .github/ting-reader-fpk-native/manifest

          # 删除可能已存在的 arch/platform 行
          sed -i "/^arch[[:space:]]*=/d" .github/ting-reader-fpk-native/manifest
          sed -i "/^platform[[:space:]]*=/d" .github/ting-reader-fpk-native/manifest

          # 确保文件末尾有换行，避免追加到行尾
          sed -i -e '$a\' .github/ting-reader-fpk-native/manifest

          # 在 version 行之后插入 platform 行
          sed -i "/^version[[:space:]]*=/a platform = ${{ matrix.arch }}" .github/ting-reader-fpk-native/manifest

          # fnpack 打包 (用目前中文版的)
          fnpack build --directory .github/ting-reader-fpk-native
          mv ting-reader.fpk "$FN_OUTPUT"

          # fygopack 打包 (切换为英文版 LICENSE)
          cp .github/ting-reader-fpk-native/LICENSE .github/ting-reader-fpk-native/LICENSE.bak
          cp .github/ting-reader-fpk-native/LICENSE.en .github/ting-reader-fpk-native/LICENSE

          fygopack build --directory .github/ting-reader-fpk-native
          mv ting-reader.fpk "$FYGO_OUTPUT"

          # 还原中文版 LICENSE
          mv .github/ting-reader-fpk-native/LICENSE.bak .github/ting-reader-fpk-native/LICENSE

      - name: Update Beta Tag
        if: steps.release_context.outputs.target == 'beta'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git tag -f beta
          git push origin beta --force

      - name: Release Beta FPK
        uses: softprops/action-gh-release@v2
        if: steps.release_context.outputs.target == 'beta'
        with:
          tag_name: beta
          name: Beta Release
          body: "Latest beta build of ting-reader native FPK."
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: |
            ting-reader-native-${{ matrix.fpk_suffix }}-beta.fpk
            ting-reader-native-fygo-${{ matrix.fpk_suffix }}-beta.fpk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Release Notes
        if: steps.release_context.outputs.target == 'formal'
        run: |
          set -euo pipefail
          awk -v header="## [${VERSION}]" '
            index($0, header " - ") == 1 { found = 1; print; next }
            found && /^## \[/ { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md

      - name: Release Formal FPK
        uses: softprops/action-gh-release@v2
        if: steps.release_context.outputs.target == 'formal'
        with:
          tag_name: v${{ env.VERSION }}
          body_path: RELEASE_NOTES.md
          files: |
            ting-reader-native-${{ matrix.fpk_suffix }}-${{ env.VERSION }}.fpk
            ting-reader-native-fygo-${{ matrix.fpk_suffix }}-${{ env.VERSION }}.fpk
          fail_on_unmatched_files: false
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
